services:
  doudouventaire:
    image: node:22-alpine
    container_name: doudouventaire
    working_dir: /app
    command: node server.js
    # Sans cela, les doudous sur le disque appartiendraient à root.
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      # Dans le conteneur, le serveur écoute toujours sur 8000 : c'est le port
      # publié qui se règle dans .env. Ainsi PORT=80 fonctionne aussi, alors que
      # le conteneur ne tourne pas en root et ne pourrait pas s'y lier lui-même.
      PORT: 8000
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./server.js:/app/server.js:ro
      - ./public:/app/public:ro
      # Les doudous vivent ici, seul dossier inscriptible et seul à sauvegarder.
      - ./data:/app/data
    restart: unless-stopped

  # Le guetteur : un tour par jour, et un message si un doudou fête son
  # anniversaire. Il lit l'étagère par le réseau interne, jamais le fichier.
  anniversaires:
    image: node:22-alpine
    container_name: doudouventaire-anniversaires
    working_dir: /app
    command: node notify.js
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      # Le nom du service suffit : pas besoin du port publié.
      APP_URL: http://doudouventaire:8000
      # Sans cela le conteneur vit en UTC, et « 09:00 » tomberait à côté.
      TZ: ${TZ:-Europe/Brussels}
    volumes:
      - ./notify.js:/app/notify.js:ro
      # Pour se souvenir du dernier jour annoncé.
      - ./data:/app/data
    depends_on:
      - doudouventaire
    restart: unless-stopped
